<style>

  @font-face{
    font-family:"Avenir Next Variable";
    src:url("https://res.cloudinary.com/mynd/raw/upload/v1785641322/AvenirNext_Variable_wmaeay.woff2") format("woff2-variations"),

  /* ---------- Tokens ----------
     Landmark palette, same values as the portal / 404 / dashboard.

     The STATUS trio is reserved: ok / watch / throttled and nothing
     else. It is never used for a data series. The chart's single
     series wears --series (teal) so the two vocabularies never
     collide.

     The categorical-palette validator was NOT run for this page:
     there is no node runtime on the build machine. It is not needed
     here — the chart carries ONE series, so no adjacent-pair CVD
     check applies, and every status colour ships with an icon and a
     word, never colour alone.                                        */
  .lmapi{
    --paper:#f7f5ef;
    --surface:#ffffff;
    --ink:#0e1a19;
    --ink-2:#43504e;
    --ink-3:#6f6b66;
    --line:#e6e2d8;
    --grid:#eceadf;

    --series:#1a6b73;
    --series-wash:rgba(26,107,115,.10);

    --ok:#217a00;
    --watch:#a86a00;
    --throttled:#c8452a;

    --sans:"Avenir Next Variable","Helvetica Neue",Arial,sans-serif;
    --radius:10px;
  }

  /* ---------- Shell ---------- */
  .lmapi{
    box-sizing:border-box;
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    min-height:100dvh;
    padding:22px 20px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .lmapi *,.lmapi *::before,.lmapi *::after{box-sizing:inherit;}
  .lmapi__wrap{max-width:1180px;margin:0 auto;}

  /* ---------- Brand band ----------
     Its own row above the masthead, separated by a hairline. The wordmark
     is Landmark green and the "Healthy" chip is status green; keeping them
     in different bands stops the two greens reading as one vocabulary.     */
  .lmapi__brand{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:0 0 14px;margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .lmapi__brand-logo{height:28px;width:auto;display:block;}
  .lmapi__brand-tag{
    font-size:11px;font-weight:600;letter-spacing:.10em;
    text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
  }
  @media (max-width:560px){
    .lmapi__brand-logo{height:22px;}
    .lmapi__brand-tag{display:none;}
  }

  /* ---------- Masthead ---------- */
  .lmapi__head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:18px;
  }
  .lmapi__eyebrow{
    margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.10em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .lmapi__h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;}
  .lmapi__sub{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2);max-width:64ch;}

  /* ---------- Status chip — icon + word + colour, never colour alone ---------- */
  .lmapi__chip{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 13px 7px 11px;border-radius:999px;
    font-size:13px;font-weight:600;white-space:nowrap;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-3);
  }
  .lmapi__chip svg{width:15px;height:15px;flex:none;}
  .lmapi__chip[data-state="ok"]{border-color:rgba(33,122,0,.35);color:var(--ok);}
  .lmapi__chip[data-state="watch"]{border-color:rgba(168,106,0,.40);color:var(--watch);}
  .lmapi__chip[data-state="throttled"]{border-color:rgba(200,69,42,.45);color:var(--throttled);background:rgba(200,69,42,.06);}

  /* ---------- Controls — one row, above everything it scopes ---------- */
  .lmapi__controls{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 14px;margin-bottom:16px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  }
  .lmapi__ctl{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);}
  .lmapi__ctl label{font-weight:500;}
  .lmapi select,.lmapi button{font-family:inherit;font-size:12px;color:var(--ink);}
  .lmapi select{
    padding:6px 8px;border:1px solid var(--line);border-radius:7px;
    background:var(--surface);min-height:32px;
  }
  .lmapi button{
    padding:7px 13px;min-height:32px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);font-weight:600;
  }
  .lmapi button:hover{border-color:#cfcabb;}
  .lmapi button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
  .lmapi__spacer{flex:1 1 auto;}
  .lmapi__stamp{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

  /* ---------- Throttle banner ---------- */
  .lmapi__banner{
    display:none;align-items:flex-start;gap:10px;
    padding:12px 14px;margin-bottom:16px;border-radius:var(--radius);
    border:1px solid rgba(200,69,42,.45);background:rgba(200,69,42,.07);
    color:var(--throttled);font-size:13px;line-height:1.5;
  }
  .lmapi__banner[data-show="1"]{display:flex;}
  .lmapi__banner svg{width:17px;height:17px;flex:none;margin-top:1px;}
  .lmapi__banner strong{font-weight:600;}

  /* ---------- Layout ---------- */
  .lmapi__grid{display:grid;gap:16px;grid-template-columns:minmax(0,300px) minmax(0,1fr);}
  @media (max-width:880px){.lmapi__grid{grid-template-columns:minmax(0,1fr);}}

  .lmapi__card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;
  }
  .lmapi__card-title{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink);}
  .lmapi__card-note{margin:0 0 14px;font-size:11.5px;line-height:1.45;color:var(--ink-3);}

  /* ---------- Hero figure — exactly one on the page ---------- */
  .lmapi__hero-label{
    margin:0;font-size:12px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .lmapi__hero{
    display:block;margin:2px 0 0;font-size:64px;line-height:1.02;font-weight:600;
    letter-spacing:-.03em;color:var(--ink);
  }
  .lmapi__hero-sub{margin:4px 0 0;font-size:13px;color:var(--ink-2);}

  /* Meter — fill carries severity, track is a lighter step of the series ramp */
  .lmapi__meter{
    margin:16px 0 0;height:10px;border-radius:999px;overflow:hidden;
    background:rgba(26,107,115,.12);
  }
  .lmapi__meter-fill{
    height:100%;width:0%;border-radius:999px;background:var(--ok);
    transition:width .28s ease,background-color .28s ease;
  }
  .lmapi__meter-fill[data-state="watch"]{background:var(--watch);}
  .lmapi__meter-fill[data-state="throttled"]{background:var(--throttled);}
  .lmapi__meter-legend{
    display:flex;justify-content:space-between;margin:7px 0 0;
    font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  }

  /* ---------- Stat tiles ---------- */
  .lmapi__tiles{
    display:grid;gap:1px;margin:18px -18px -16px;
    grid-template-columns:1fr 1fr;background:var(--line);
    border-top:1px solid var(--line);
    border-radius:0 0 var(--radius) var(--radius);overflow:hidden;
  }
  .lmapi__tile{background:var(--surface);padding:12px 18px 13px;}
  .lmapi__tile-label{
    margin:0;font-size:11px;font-weight:500;color:var(--ink-3);
    line-height:1.3;min-height:2.6em;
  }
  .lmapi__tile-value{
    display:block;margin:3px 0 0;font-size:22px;font-weight:600;
    letter-spacing:-.01em;color:var(--ink);
  }
  .lmapi__tile-value[data-state="throttled"]{color:var(--throttled);}

  /* ---------- Chart ---------- */
  .lmapi__chart-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:10px;
  }
  .lmapi__plot{position:relative;width:100%;transition:opacity .2s ease;}
  .lmapi__plot[data-stale="1"]{opacity:.45;}
  .lmapi__plot svg{display:block;width:100%;height:auto;overflow:visible;}

  .lmapi__grid-line{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges;}
  .lmapi__axis-line{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges;}
  .lmapi__tick{fill:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums;}
  .lmapi__rule{stroke-width:1;shape-rendering:crispEdges;}
  .lmapi__rule--watch{stroke:var(--watch);}
  .lmapi__rule--limit{stroke:var(--throttled);}
  .lmapi__rule-label{font-size:10px;font-weight:600;}
  .lmapi__rule-label--watch{fill:var(--watch);}
  .lmapi__rule-label--limit{fill:var(--throttled);}
  .lmapi__area{fill:var(--series-wash);}
  .lmapi__line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .lmapi__end-dot{fill:var(--series);stroke:var(--surface);stroke-width:2;}
  .lmapi__end-label{fill:var(--ink);font-size:12px;font-weight:600;}
  .lmapi__crosshair{stroke:var(--ink-3);stroke-width:1;shape-rendering:crispEdges;opacity:.45;}
  .lmapi__hover-dot{fill:var(--series);stroke:var(--surface);stroke-width:2;}
  .lmapi__throttle-mark{fill:var(--throttled);stroke:var(--surface);stroke-width:2;}
  .lmapi__empty{fill:var(--ink-3);font-size:12px;}

  .lmapi__tip{
    position:absolute;pointer-events:none;z-index:5;
    padding:8px 10px;border-radius:8px;
    background:var(--ink);color:#fff;font-size:11.5px;line-height:1.5;
    white-space:nowrap;opacity:0;transition:opacity .12s ease;
    font-variant-numeric:tabular-nums;
  }
  .lmapi__tip[data-show="1"]{opacity:1;}
  .lmapi__tip b{font-weight:600;}

  /* ---------- Table view ---------- */
  .lmapi__table-wrap{display:none;margin-top:14px;max-height:280px;overflow:auto;}
  .lmapi__table-wrap[data-show="1"]{display:block;}
  .lmapi table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;}
  .lmapi th,.lmapi td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  .lmapi th:first-child,.lmapi td:first-child{text-align:left;}
  .lmapi thead th{
    position:sticky;top:0;background:var(--surface);
    font-weight:600;color:var(--ink-3);font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .lmapi tbody tr[data-throttled="1"] td{color:var(--throttled);}

  /* ---------- Event log ---------- */
  .lmapi__log{
    margin:0;padding:0;list-style:none;max-height:230px;overflow:auto;
    font-size:12px;line-height:1.55;
  }
  .lmapi__log li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
  .lmapi__log li:last-child{border-bottom:0;}
  .lmapi__log time{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}
  .lmapi__log span{color:var(--ink-2);}
  .lmapi__log li[data-kind="throttled"] span{color:var(--throttled);font-weight:600;}
  .lmapi__log li[data-kind="watch"] span{color:var(--watch);}
  .lmapi__log li[data-kind="ok"] span{color:var(--ok);}

  .lmapi__foot{margin:22px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-3);max-width:80ch;}
  .lmapi__foot code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;background:#efece2;padding:1px 5px;border-radius:4px;
  }

  @media (prefers-reduced-motion:reduce){
    .lmapi *{transition:none !important;}
  }

</style>
