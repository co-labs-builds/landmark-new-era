<!-- Dynamic block item (data source: Invitations related to the Registration
     this page is based on). One per Invitation. Keep the class names: the
     footer script reads these rows and builds the guest list from them. -->
<div class="guest-row">
  <div>
    <span class="guest-name">[Block//Guest//First Name] [Block//Guest//Last Name]</span>
    <span class="guest-date">Invited [Block//Date Invited %M j%+0]</span>
  </div>
  <span class="guest-url">[Block//(Invited) Guest Zoom URL]</span>
</div>
