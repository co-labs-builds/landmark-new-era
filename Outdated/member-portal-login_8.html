  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 18% 90%, rgba(33,122,0,.18), transparent 60%),
      linear-gradient(180deg, rgba(10,34,38,.66) 0%, rgba(10,34,38,.58) 7%, rgba(10,34,38,.22) 18%, rgba(10,34,38,.08) 32%, rgba(10,34,38,.10) 60%, rgba(10,34,38,.30) 80%, rgba(10,34,38,.90) 100%);
    z-index:1;
  }
  .stage > *{position:relative;z-index:2;}

  .brand-logo{height:34px;width:auto;flex:0 0 auto;align-self:flex-start;display:block;filter:drop-shadow(0 1px 10px rgba(0,0,0,.35));}

  .stage-copy{max-width:620px;}
  .stage-eyebrow{
    font-family:"Tiempos Headline",Georgia,serif;font-style:italic;font-weight:300;
    font-size:clamp(20px,2.2vw,29px);color:rgba(255,255,255,.92);
    margin-bottom:6px;letter-spacing:.01em;
    text-shadow:0 1px 18px rgba(0,0,0,.35);
  }
  .stage-title{
    font-family:"objektiv-mk1",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:-.015em;line-height:.9;
    font-size:clamp(46px,6.4vw,96px);color:#fff;
    text-shadow:0 2px 30px rgba(0,0,0,.35);
  }
  .stage-rule{width:54px;height:3px;background:var(--green-bright);margin-top:22px;border-radius:2px;}

  .panel{
    position:relative;flex:1 1 0;min-width:340px;max-width:520px;
    background:var(--primary);
    display:flex;flex-direction:column;justify-content:center;
    padding:64px 56px;
  }
  .panel::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(90% 55% at 82% 8%, rgba(33,122,0,.16), transparent 60%);
    pointer-events:none;
  }
  .form-wrap{position:relative;z-index:2;width:100%;max-width:360px;margin:0 auto;}

  .welcome{
    font-family:"objektiv-mk1",sans-serif;font-weight:700;
    font-size:40px;letter-spacing:-.01em;color:#fff;margin-bottom:10px;
  }
  .welcome .dot{color:var(--green-bright);}
  .subhead{color:var(--muted);font-size:15.5px;line-height:1.5;margin-bottom:38px;}

  .field{margin-bottom:20px;}
  .field label{
    display:block;font-size:11px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:9px;
  }
  .field input{
    width:100%;border:1px solid rgba(255,255,255,.14);border-radius:5px;
    background:#fff;color:var(--primary);
    padding:15px 16px;font-size:15px;font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{color:#9aa3a2;}
  .field input:focus{
    outline:none;border-color:var(--green-bright);
    box-shadow:0 0 0 3px rgba(46,162,3,.25);
  }

  .btn{
    width:100%;border:none;border-radius:5px;cursor:pointer;
    background:var(--green);color:#fff;
    padding:16px;margin-top:8px;
    font-family:inherit;font-size:14px;font-weight:700;
    text-transform:uppercase;letter-spacing:.14em;
    transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{background:var(--green-bright);}
  .btn:active{transform:translateY(1px);}

  .help{margin-top:30px;text-align:left;}
  .help p{color:var(--muted);font-size:13.5px;margin-bottom:10px;}
  .help a{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--green-bright);text-decoration:none;
    font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  }
  .help a:hover{color:#fff;}
  .help a svg{width:15px;height:15px;flex:none;}

  .panel-foot{
    position:relative;z-index:2;margin-top:auto;padding-top:40px;
    text-align:center;color:rgba(255,255,255,.38);font-size:11.5px;line-height:1.7;
  }
  .panel-foot span{color:rgba(255,255,255,.55);}

  @media (max-width:900px){
    .portal{flex-direction:column;}
    .stage{flex:none;min-height:44vh;padding:30px 30px 38px;}
    .stage-title{font-size:clamp(40px,10vw,64px);}
    .panel{flex:none;max-width:none;width:100%;padding:48px 26px 40px;min-width:0;}
    .form-wrap{max-width:420px;}
    .panel-foot{padding-top:34px;}
  }
  @media (max-width:420px){
    .stage{padding:24px 22px 30px;}
    .welcome{font-size:34px;}
  }
</style>
</head>
