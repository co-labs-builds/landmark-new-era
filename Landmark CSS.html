        left: 50%;
        transform: translateX(-50%);
        background: var(--teal);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s;
    }

    .inv-copy:hover .tip {
        opacity: 1;
    }

    .inv-copy.copied {
        border-color: var(--green-bright);
        color: var(--green-bright);
    }

    .inv-more {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1.5px solid var(--green);
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--green);
        cursor: pointer;
        text-decoration: none;
        transition: background .15s, border-color .15s;
    }

    .inv-more:hover {
        background: rgba(45, 174, 14, .07);
    }

    .inv-more svg {
        width: 14px;
        height: 14px;
    }

    .inv-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
    }

    .inv-pager {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .inv-pager-count {
        font-size: 12.5px;
        color: var(--gray);
    }

    .inv-pager-btn {
        background: none;
        border: none;
        padding: 6px 2px;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        color: var(--green);
        cursor: pointer;
    }

    .inv-pager-btn:hover {
        color: var(--green-bright);
    }

    .inv-pager-btn:disabled {
        color: rgba(13, 45, 49, .3);
        cursor: not-allowed;
    }


    @media (max-width:900px) {
        .pgrid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width:640px) {
        .wrap {
            padding: 0 22px;
        }

        .nav-links {
            display: none;
        }

        .nav-cta-slot {
            display: none;
        }

        .fab-account {
            top: 14px;
            right: 22px;
        }

        footer.foot .wrap {
            flex-direction: column;
            text-align: center;
        }

        .pgrid {
            grid-template-columns: 1fr;
        }

        .hero-inner {
            grid-template-columns: 1fr;
            gap: 34px;
            padding-top: 52px;
            padding-bottom: 60px;
        }

        .pcards {
            grid-template-columns: 1fr;
        }

        .flips {
            grid-template-columns: 1fr;
        }

        .g-note .np {
            display: none;
        }

        .rules {
            grid-template-columns: 1fr;
            gap: 26px;
            padding: 34px;
        }

        .faq {
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .faq .huge {
            position: static;
        }

        .contact-grid {
            grid-template-columns: 1fr;
            gap: 30px;
        }

        section.block {
            padding: 52px 0;
        }

        .actions {
            grid-template-columns: 1fr;
        }

        .today-row {
            grid-template-columns: 1fr;
        }

        .gradfeat {
            grid-template-columns: 1fr;
        }

        .gradfeat .gph {
            height: 240px;
            min-height: 0;
        }

        .pc-cta {
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
        }

        .pc-logo {
            margin: 0;
            top: 0;
            align-self: center;
        }

        .btn-join {
            width: 100%;
            justify-content: center;
        }

        .infogate .row {
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
            padding: 20px 0;
        }

        .infogate .ig-actions {
            width: 100%;
        }

        .infogate .ig-btn,
        .infogate .ig-alt {
            white-space: normal;
            text-align: center;
        }
    }
